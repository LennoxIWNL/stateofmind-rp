name: ci

on:
  pull_request:
  push:
    branches: [main, BetaRelease]

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Branch name has no tool or session identifier
        if: github.event_name == 'pull_request'
        run: |
          case "${{ github.head_ref }}" in
            claude/*|ai/*|bot/*) echo "branch name must describe the work (feature/, fix/, chore/, docs/)"; exit 1 ;;
          esac
          if [ "${{ github.head_ref }}" = "BetaRelease" ] && [ "${{ github.base_ref }}" = "main" ]; then
            exit 0
          fi
          if ! echo "${{ github.head_ref }}" | grep -Eq '^(feature|fix|chore|docs)/[a-z0-9]+(-[a-z0-9]+)*$'; then
            echo "branch must be feature|fix|chore|docs/<kebab-case>"; exit 1
          fi

      - name: Commits carry no attribution lines
        if: github.event_name == 'pull_request'
        run: |
          range="origin/${{ github.base_ref }}..HEAD"
          if git log --format=%B "$range" | grep -Eiq 'Co-Authored-By|Claude-Session|noreply@anthropic|Generated with'; then
            echo "commit messages must not contain co-author, tool or session attribution"; exit 1
          fi

      - name: No em dashes in our code and docs
        run: |
          if grep -rIl '—' --include='*.lua' --include='*.md' --include='*.sh' --include='*.py' --include='*.mjs' --include='*.sql' \
              txData/*/resources/\[som\] tests tools CLAUDE.md LAUNCH-TODO.md LAUNCH-OPS.md .claude/skills 2>/dev/null; then
            echo "em dash found; CLAUDE.md forbids them"; exit 1
          fi

      - name: No committed Discord webhook URLs
        run: |
          if grep -rEn 'discord(app)?\.com/api/webhooks/[0-9]' --include='*.lua' --include='*.js' --include='*.mjs' --include='*.json' --include='*.md' . --exclude-dir=node_modules --exclude-dir=.git; then
            echo "real webhook URL committed; use GetConvar and server.cfg"; exit 1
          fi

  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Syntax check our Lua
        run: tools/check-lua.sh
      - name: No accidental globals
        run: python3 tools/lint-globals.py
      - name: Server tests
        run: lua5.4 tests/run.lua
      - name: Repo index server self-test
        run: node tools/som-mcp/selftest.mjs
      - name: Wiring check self-test
        run: node tools/wiring-selftest.mjs
      - name: Exports, callbacks, events, tables and items all resolve
        run: node tools/wiring-check.mjs
      - name: Every item a system needs has a source
        run: node tools/economy-map.mjs --check
      - name: Every inventory item has an icon
        run: python3 tools/check-item-icons.py

  nui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: NUI tests
        run: node tests/nui/run.mjs

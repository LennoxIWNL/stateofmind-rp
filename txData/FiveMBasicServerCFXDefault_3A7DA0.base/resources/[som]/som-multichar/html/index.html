<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>som-multichar</title>
    <link rel="stylesheet" href="https://cfx-nui-som-assets/tokens.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="root" class="root hidden">
        <!-- Scrim only behind the rail, so the character stays clean -->
        <div class="scrim" aria-hidden="true"></div>

        <aside class="rail">
            <header class="brand">
                <div class="brand__mark">
                    <span class="brand__line">STATE OF</span>
                    <span class="brand__word">MIND</span>
                </div>
                <div class="brand__rule" aria-hidden="true"></div>
            </header>

            <!-- ROSTER -->
            <section id="view-roster" class="view view--roster">
                <div class="view__head">
                    <h2 class="view__title">Characters</h2>
                    <span id="slot-count" class="view__count"></span>
                </div>

                <div id="roster" class="roster" role="list"></div>

                <footer class="hints">
                    <span><kbd class="som-key">↑↓</kbd> Navigate</span>
                    <span><kbd class="som-key">↵</kbd> Play</span>
                </footer>
            </section>

            <!-- CREATE -->
            <section id="view-create" class="view view--create hidden">
                <div class="view__head">
                    <h2 class="view__title">New Character</h2>
                    <span id="create-slot" class="view__count"></span>
                </div>

                <form id="create-form" class="form" autocomplete="off" novalidate>
                    <div class="field-row">
                        <label class="field">
                            <span class="field__label">First name</span>
                            <input class="field__input" name="firstname" maxlength="24" spellcheck="false" required>
                        </label>
                        <label class="field">
                            <span class="field__label">Last name</span>
                            <input class="field__input" name="lastname" maxlength="24" spellcheck="false" required>
                        </label>
                    </div>

                    <label class="field">
                        <span class="field__label">Date of birth</span>
                        <input class="field__input" name="dob" type="date" required>
                    </label>

                    <label class="field">
                        <span class="field__label">Nationality</span>
                        <div class="select">
                            <select class="field__input" name="nationality" id="nationality"></select>
                        </div>
                    </label>

                    <fieldset class="field">
                        <legend class="field__label">Gender</legend>
                        <div class="segmented" id="gender-group">
                            <label class="segmented__opt">
                                <input type="radio" name="gender" value="0" checked>
                                <span>Male</span>
                            </label>
                            <label class="segmented__opt">
                                <input type="radio" name="gender" value="1">
                                <span>Female</span>
                            </label>
                            <span class="segmented__thumb" aria-hidden="true"></span>
                        </div>
                    </fieldset>

                    <p id="form-error" class="form__error" role="alert"></p>

                    <div class="form__actions">
                        <button type="button" class="btn" data-action="back">Cancel</button>
                        <button type="submit" class="btn btn--primary" id="create-submit">
                            <span>Create</span>
                        </button>
                    </div>
                </form>
            </section>
        </aside>
    </div>

    <script src="app.js"></script>
</body>
</html>

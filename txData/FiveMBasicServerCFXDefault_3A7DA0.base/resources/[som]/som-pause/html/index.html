<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>som-pause</title>
    <link rel="stylesheet" href="https://cfx-nui-som-assets/tokens.css">
    <link rel="stylesheet" href="https://cfx-nui-som-pause/html/style.css">
</head>
<body>
    <div id="root" class="root hidden">
        <!-- Pink wash over the blurred world. The only colour layer: the native
             beige one is avoided by suppressing the native menu entirely. -->
        <div id="tint" class="tint"></div>

        <header class="bar">
            <div class="bar__brand">
                <img id="logo" class="bar__logo"
                     src="https://cfx-nui-som-assets/img/som-logo.png" alt="">
                <span id="server-name" class="bar__name">State of Mind RP</span>
            </div>

            <div class="bar__meta">
                <div class="meta">
                    <span class="meta__label">Playing as</span>
                    <span class="meta__value" id="meta-name">-</span>
                </div>
                <span class="meta__sep"></span>
                <div class="meta">
                    <span class="meta__label">Employment</span>
                    <span class="meta__value">
                        <span id="meta-job">-</span>
                        <span id="meta-duty" class="badge hidden">On duty</span>
                    </span>
                </div>
                <span class="meta__sep"></span>
                <div class="meta">
                    <span class="meta__label">Online</span>
                    <span class="meta__value" id="meta-players">-</span>
                </div>
                <span class="meta__sep"></span>
                <div class="meta">
                    <span class="meta__label">Local time</span>
                    <span class="meta__value" id="meta-clock">--:--</span>
                </div>
            </div>

            <nav class="bar__actions" id="actions"></nav>
        </header>

        <footer class="hints">
            <span class="hint"><span class="som-key">Esc</span> Resume</span>
            <span class="hint"><span class="som-key">1</span>&ndash;<span class="som-key">3</span> Actions</span>
        </footer>
    </div>

    <script src="https://cfx-nui-som-pause/html/app.js"></script>
</body>
</html>

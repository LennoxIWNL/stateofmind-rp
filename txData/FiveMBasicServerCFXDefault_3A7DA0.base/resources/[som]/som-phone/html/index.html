<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>som-phone</title>
    <link rel="stylesheet" href="https://cfx-nui-som-assets/tokens.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="root" class="root hidden">
        <div class="phone">
            <div class="phone__notch" aria-hidden="true"></div>

            <header class="status">
                <span id="status-time" class="status__time">--:--</span>
                <span class="status__right">
                    <span id="status-owner" class="status__owner"></span>
                </span>
            </header>

            <main id="screen" class="screen">
                <!-- HOME -->
                <section id="view-home" class="view">
                    <div id="apps" class="apps"></div>
                </section>

                <!-- BANK -->
                <section id="view-bank" class="view hidden">
                    <div class="app-head">
                        <button class="back" data-back aria-label="Back">&lsaquo;</button>
                        <h2 class="app-head__title">Bank</h2>
                    </div>

                    <div class="balance">
                        <span class="balance__label">Balance</span>
                        <span id="bank-balance" class="balance__value">$0</span>
                        <button id="bank-account" class="account" title="Tap to share with people nearby">
                            <span id="bank-account-no">---</span>
                            <span class="account__hint">tap to share</span>
                        </button>
                    </div>

                    <nav class="tabs">
                        <button class="tab is-active" data-tab="history">History</button>
                        <button class="tab" data-tab="bills">Bills <span id="bill-count" class="pill hidden">0</span></button>
                        <button class="tab" data-tab="send">Send</button>
                    </nav>

                    <div id="tab-history" class="tabpane"></div>

                    <div id="tab-bills" class="tabpane hidden">
                        <div id="bills-list"></div>
                        <h3 class="section">Bill someone</h3>
                        <form id="bill-form" class="form">
                            <select id="bill-account" class="input"></select>
                            <input id="bill-amount" class="input" type="number" min="1" placeholder="Amount">
                            <input id="bill-reason" class="input" maxlength="128" placeholder="Reason">
                            <button class="btn btn--primary" type="submit">Send bill</button>
                        </form>
                    </div>

                    <div id="tab-send" class="tabpane hidden">
                        <form id="send-form" class="form">
                            <select id="send-account" class="input"></select>
                            <input id="send-amount" class="input" type="number" min="1" placeholder="Amount">
                            <button class="btn btn--primary" type="submit">Transfer</button>
                        </form>
                        <p class="hint">Transfers are instant and cannot be reversed. A bill has to be accepted, which is safer for both sides.</p>
                    </div>
                </section>

                <!-- SETTINGS -->
                <section id="view-settings" class="view hidden">
                    <div class="app-head">
                        <button class="back" data-back aria-label="Back">&lsaquo;</button>
                        <h2 class="app-head__title">Settings</h2>
                    </div>
                    <h3 class="section">Theme</h3>
                    <div id="themes" class="themes"></div>
                </section>
            </main>

            <button id="home-btn" class="home" aria-label="Home"></button>
        </div>

        <p class="dismiss">Press <span class="som-key">Esc</span> to close</p>
    </div>

    <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>som-chat</title>
    <link rel="stylesheet" href="https://cfx-nui-som-assets/tokens.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Input only. There is deliberately no message log: nothing is ever on
         screen unless the player is typing. -->
    <div id="entry" class="entry hidden">
        <span class="entry__prefix">/</span>
        <input id="input" class="entry__input" maxlength="256"
               autocomplete="off" spellcheck="false" placeholder="command">
    </div>
    <script src="app.js"></script>
</body>
</html>

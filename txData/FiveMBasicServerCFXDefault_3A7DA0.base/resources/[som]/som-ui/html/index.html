<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>som-ui</title>
    <link rel="stylesheet" href="https://cfx-nui-som-assets/tokens.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="notifications" class="notifications" aria-live="polite"></div>

    <!-- Progress. Hidden until a resource asks for it. Never takes NUI focus:
         the player is mid-action and must keep control of the mouse. -->
    <div id="progress" class="progress" hidden>
        <div class="progress__card">
            <div class="progress__head">
                <span id="progress-label" class="progress__label"></span>
                <span id="progress-cancel" class="progress__cancel">
                    <span class="som-key">X</span> cancel
                </span>
            </div>
            <div class="progress__track">
                <div id="progress-fill" class="progress__fill"></div>
            </div>
        </div>
    </div>

    <!-- Context menus, replacing ox_lib's. Unlike the progress bar this DOES
         take NUI focus, because a menu is something you click. The backdrop is
         part of the menu rather than always present, so nothing on this page
         intercepts a click at any other time. -->
    <div id="context" class="context" hidden>
        <div class="context__backdrop" id="context-backdrop"></div>

        <div class="context__panel" role="dialog" aria-modal="true">
            <header class="context__head">
                <button class="context__back" id="context-back" type="button"
                        aria-label="Back" hidden>&#8249;</button>

                <h1 class="context__title" id="context-title"></h1>

                <button class="context__close" id="context-close" type="button"
                        aria-label="Close">&#10005;</button>
            </header>

            <div class="context__body" id="context-options"></div>
        </div>
    </div>

    <!-- Skill checks, replacing ox_lib's. Takes keyboard focus and NO cursor:
         the whole interaction is one key against a moving needle, and a cursor
         parked in the middle of the dial would be in the way. -->
    <div id="skillcheck" class="skill" hidden>
        <div class="skill__dial">
            <svg class="skill__ring" viewBox="0 0 120 120" aria-hidden="true">
                <circle class="skill__track" cx="60" cy="60" r="52"></circle>
                <circle class="skill__area" id="skill-area" cx="60" cy="60" r="52"></circle>
                <g id="skill-needle">
                    <line class="skill__needle" x1="60" y1="4" x2="60" y2="22"></line>
                </g>
            </svg>

            <div class="skill__centre">
                <span class="som-key skill__key" id="skill-key">E</span>
                <span class="skill__rounds" id="skill-rounds"></span>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>

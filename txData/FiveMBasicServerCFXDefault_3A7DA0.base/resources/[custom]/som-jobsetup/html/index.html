<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--pink:#FF1493;--pink-dim:rgba(255,20,147,.25);--bg:rgba(10,10,18,.96);--card:rgba(25,25,35,.9);--card-hover:rgba(35,35,50,.95);--text:#e0e0e0;--dim:#777;--danger:#e74c3c;--success:#2ecc71;--radius:8px}
body{font-family:'Segoe UI',sans-serif;overflow:hidden;color:var(--text);user-select:none}
#app{position:fixed;top:0;right:-400px;width:380px;height:100vh;background:var(--bg);border-left:2px solid var(--pink);display:flex;flex-direction:column;transition:right .3s ease;z-index:9999}
#app.open{right:0}
.header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid rgba(255,20,147,.3)}
.header .logo{font-size:14px;font-weight:700;letter-spacing:.5px}
.header .logo span{color:var(--pink)}
.close-btn{background:none;border:1px solid rgba(255,255,255,.2);color:var(--text);width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.close-btn:hover{border-color:var(--pink);color:var(--pink)}
.breadcrumb{padding:8px 18px;font-size:11px;color:var(--dim);border-bottom:1px solid rgba(255,255,255,.05)}
.breadcrumb span{cursor:pointer}.breadcrumb span:hover{color:var(--pink)}
.breadcrumb .sep{margin:0 6px;color:rgba(255,255,255,.15)}
.content{flex:1;overflow-y:auto;padding:14px 18px}
.content::-webkit-scrollbar{width:4px}.content::-webkit-scrollbar-thumb{background:var(--pink-dim);border-radius:2px}
.footer{padding:10px 18px;text-align:center;font-size:10px;color:var(--dim);border-top:1px solid rgba(255,255,255,.05);letter-spacing:1px}
.card{background:var(--card);border:1px solid rgba(255,255,255,.06);border-radius:var(--radius);padding:14px 16px;margin-bottom:8px;cursor:pointer;transition:all .2s}
.card:hover{background:var(--card-hover);border-color:var(--pink-dim);transform:translateX(-2px)}
.card .card-title{font-size:13px;font-weight:600;margin-bottom:3px}
.card .card-desc{font-size:11px;color:var(--dim)}
.card .card-icon{color:var(--pink);margin-right:10px;width:16px;text-align:center;font-size:14px}
.card-row{display:flex;align-items:center}
.section-title{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--pink);margin:16px 0 8px;font-weight:600}
.section-title:first-child{margin-top:0}
.btn{padding:8px 16px;border:none;border-radius:var(--radius);cursor:pointer;font-size:12px;font-weight:600;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.btn-pink{background:var(--pink);color:#fff}.btn-pink:hover{filter:brightness(1.15)}
.btn-secondary{background:rgba(255,255,255,.08);color:var(--text);border:1px solid rgba(255,255,255,.12)}.btn-secondary:hover{border-color:var(--pink)}
.btn-danger{background:var(--danger);color:#fff}.btn-danger:hover{filter:brightness(1.15)}
.btn-success{background:var(--success);color:#fff}.btn-success:hover{filter:brightness(1.15)}
.btn-block{width:100%;justify-content:center;padding:10px}
.btn-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:11px;color:var(--dim);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.form-group input,.form-group select{width:100%;padding:8px 12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:var(--radius);color:var(--text);font-size:13px;outline:none;transition:border-color .2s}
.form-group input:focus,.form-group select:focus{border-color:var(--pink)}
.form-group select option{background:#1a1a2e;color:var(--text)}
.checkbox-row{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px}
.checkbox-row input[type=checkbox]{accent-color:var(--pink);width:16px;height:16px}
.empty{text-align:center;padding:40px 0;color:var(--dim);font-size:13px}
.search-box{margin-bottom:12px}
.search-box input{width:100%;padding:8px 12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:var(--radius);color:var(--text);font-size:12px;outline:none}
.search-box input:focus{border-color:var(--pink)}
.coords-badge{display:inline-block;background:var(--pink-dim);color:var(--pink);padding:2px 8px;border-radius:4px;font-size:10px;font-family:monospace}
.tag{display:inline-block;padding:2px 6px;border-radius:3px;font-size:10px;margin-right:4px}
.tag-job{background:rgba(52,152,219,.2);color:#3498db}
.tag-type{background:var(--pink-dim);color:var(--pink)}
#modal{position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:10000}
#modal.hidden{display:none}
.modal-box{background:var(--bg);border:1px solid var(--pink-dim);border-radius:12px;padding:24px;width:320px;text-align:center}
.modal-box h3{margin-bottom:12px;font-size:15px}
.modal-box p{font-size:12px;color:var(--dim);margin-bottom:16px}
.modal-actions{display:flex;gap:8px;justify-content:center}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="logo"><span>State of Mind</span> · Job Setup</div>
    <button class="close-btn" onclick="closeUI()">&#x2715;</button>
  </div>
  <div class="breadcrumb" id="breadcrumb"></div>
  <div class="content" id="content"></div>
  <div class="footer">STATE OF MIND RP</div>
</div>
<div id="modal" class="hidden">
  <div class="modal-box">
    <h3 id="modal-title"></h3>
    <p id="modal-body"></p>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-danger" id="modal-confirm">Confirm</button>
    </div>
  </div>
</div>
<script>
const app = document.getElementById('app');
const content = document.getElementById('content');
const breadcrumb = document.getElementById('breadcrumb');
const modal = document.getElementById('modal');

let state = {
  points: [], types: {}, jobs: [], jobConfigs: {},
  selectedPoint: null, selectedJob: null, selectedJobRes: null,
  jobLocations: {}, search: ''
};
let modalCallback = null;

function resName(){ return window.location.hostname.replace('cfx-nui-',''); }

function post(endpoint, data){
  return fetch('https://'+resName()+'/'+endpoint,{
    method:'POST',headers:{'Content-Type':'application/json;charset=UTF-8'},
    body:JSON.stringify(data||{})
  }).then(r=>r.json()).catch(()=>({}));
}

function setBreadcrumb(items){
  breadcrumb.innerHTML = items.map((it,i)=>{
    if(i===items.length-1) return '<span style="color:var(--text)">'+it.label+'</span>';
    return '<span onclick="'+it.action+'">'+it.label+'</span><span class="sep">/</span>';
  }).join('');
}

function showModal(title, body, onConfirm, btnLabel){
  document.getElementById('modal-title').textContent=title;
  document.getElementById('modal-body').textContent=body;
  const btn=document.getElementById('modal-confirm');
  btn.textContent=btnLabel||'Confirm';
  modalCallback=onConfirm;
  btn.onclick=()=>{closeModal();if(modalCallback)modalCallback();};
  modal.classList.remove('hidden');
}
function closeModal(){modal.classList.add('hidden');modalCallback=null;}

// ── Pages ─────────────────────────────────────────

function renderHome(){
  setBreadcrumb([{label:'Home'}]);
  const n=state.points.length;
  content.innerHTML=`
    <div class="section-title">Quick Actions</div>
    <div class="card" onclick="renderAddPoint()">
      <div class="card-row"><span class="card-icon">+</span><div><div class="card-title">Add Interaction Point</div><div class="card-desc">Capture your position as a new point</div></div></div>
    </div>
    <div class="card" onclick="renderPointsList()">
      <div class="card-row"><span class="card-icon">&#9776;</span><div><div class="card-title">Manage Points</div><div class="card-desc">${n} point(s) configured</div></div></div>
    </div>
    <div class="section-title">Job Config Injection</div>
    <div class="card" onclick="renderJobsList()">
      <div class="card-row"><span class="card-icon">&#9881;</span><div><div class="card-title">Set up Job Interactions</div><div class="card-desc">Write coords into PD / EMS configs</div></div></div>
    </div>
    <div class="section-title">Tools</div>
    <div class="card" onclick="toggleCoords()">
      <div class="card-row"><span class="card-icon">&#8982;</span><div><div class="card-title">Toggle Live Coords</div><div class="card-desc">Show/hide coordinate overlay</div></div></div>
    </div>
    <div class="card" onclick="exportPoints()">
      <div class="card-row"><span class="card-icon">&#8599;</span><div><div class="card-title">Export Points</div><div class="card-desc">Print JSON to F8 console</div></div></div>
    </div>`;
}

function renderAddPoint(){
  setBreadcrumb([{label:'Home',action:'renderHome()'},{label:'Add Point'}]);
  let jobOpts=state.jobs.map(j=>'<option value="'+j+'">'+j+'</option>').join('');
  let typeOpts=Object.entries(state.types).sort((a,b)=>a[1].label.localeCompare(b[1].label))
    .map(([k,v])=>'<option value="'+k+'">'+v.label+'</option>').join('');
  content.innerHTML=`
    <div class="section-title">New Interaction Point</div>
    <div class="form-group"><label>Label</label><input id="ap-label" value="New Point"></div>
    <div class="form-group"><label>Job</label><select id="ap-job">${jobOpts}<option value="__custom">Custom...</option></select></div>
    <div class="form-group" id="ap-custom-wrap" style="display:none"><label>Custom Job Name</label><input id="ap-custom"></div>
    <div class="form-group"><label>Type</label><select id="ap-type">${typeOpts}</select></div>
    <div class="form-group"><label>Radius (m)</label><input id="ap-radius" type="number" value="1.5" min="0.5" max="10" step="0.5"></div>
    <label class="checkbox-row"><input type="checkbox" id="ap-restrict"> Restrict to this job only</label>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="renderHome()">Cancel</button>
      <button class="btn btn-pink btn-block" onclick="submitAddPoint()">Create Point Here</button>
    </div>`;
  document.getElementById('ap-job').onchange=function(){
    document.getElementById('ap-custom-wrap').style.display=this.value==='__custom'?'block':'none';
  };
}

function submitAddPoint(){
  let job=document.getElementById('ap-job').value;
  if(job==='__custom') job=document.getElementById('ap-custom').value||'unknown';
  post('addPoint',{
    label:document.getElementById('ap-label').value,
    job:job,
    pointType:document.getElementById('ap-type').value,
    radius:parseFloat(document.getElementById('ap-radius').value)||1.5,
    restrictJob:document.getElementById('ap-restrict').checked
  }).then(()=>renderHome());
}

function renderPointsList(){
  setBreadcrumb([{label:'Home',action:'renderHome()'},{label:'Points'}]);
  let pts=state.points;
  if(state.search){
    const q=state.search.toLowerCase();
    pts=pts.filter(p=>(p.label||'').toLowerCase().includes(q)||(p.job||'').toLowerCase().includes(q));
  }
  let cards=pts.map(p=>`
    <div class="card" onclick="selectPoint(${p.id})">
      <div class="card-title">${p.label||p.type}</div>
      <div class="card-desc">
        <span class="tag tag-job">${p.job||'-'}</span>
        <span class="tag tag-type">${p.type}</span>
        <span class="coords-badge">${p.coords.x.toFixed(1)}, ${p.coords.y.toFixed(1)}, ${p.coords.z.toFixed(1)}</span>
      </div>
    </div>`).join('');
  if(!pts.length) cards='<div class="empty">No points found</div>';
  content.innerHTML=`
    <div class="search-box"><input placeholder="Search points..." value="${state.search}" oninput="state.search=this.value;renderPointsList()"></div>
    ${cards}`;
}

function selectPoint(id){
  state.selectedPoint=state.points.find(p=>p.id===id);
  if(!state.selectedPoint)return;
  renderPointDetail();
}

function renderPointDetail(){
  const p=state.selectedPoint;
  if(!p)return renderPointsList();
  setBreadcrumb([{label:'Home',action:'renderHome()'},{label:'Points',action:'renderPointsList()'},{label:p.label||p.type}]);
  const actionDesc=p.action?`${p.action.kind}: ${p.action.name}`:'None';
  content.innerHTML=`
    <div class="section-title">Point Info</div>
    <div style="margin-bottom:12px">
      <div style="font-size:16px;font-weight:700;margin-bottom:4px">${p.label||p.type}</div>
      <span class="tag tag-job">${p.job||'-'}</span>
      <span class="tag tag-type">${p.type}</span>
      <div style="margin-top:6px"><span class="coords-badge">${p.coords.x.toFixed(2)}, ${p.coords.y.toFixed(2)}, ${p.coords.z.toFixed(2)} | H: ${(p.heading||0).toFixed(1)}</span></div>
      <div style="margin-top:6px;font-size:11px;color:var(--dim)">Radius: ${p.radius||1.5}m | Action: ${actionDesc}</div>
    </div>
    <div class="section-title">Actions</div>
    <div class="card" onclick="post('teleportToPoint',{id:${p.id}})">
      <div class="card-row"><span class="card-icon">&#10148;</span><div><div class="card-title">Teleport to Point</div></div></div>
    </div>
    <div class="card" onclick="movePoint(${p.id})">
      <div class="card-row"><span class="card-icon">&#8694;</span><div><div class="card-title">Move Point to Me</div><div class="card-desc">Update coords to your current position</div></div></div>
    </div>
    <div class="card" onclick="renderEditAction()">
      <div class="card-row"><span class="card-icon">&#9889;</span><div><div class="card-title">Set / Edit Action</div><div class="card-desc">${actionDesc}</div></div></div>
    </div>
    <div class="card" onclick="post('toggleMarker',{id:${p.id}})">
      <div class="card-row"><span class="card-icon">&#9673;</span><div><div class="card-title">Toggle Marker</div></div></div>
    </div>
    <div class="btn-row" style="margin-top:16px">
      <button class="btn btn-danger btn-block" onclick="deletePoint(${p.id})">Delete Point</button>
    </div>`;
}

function movePoint(id){
  showModal('Move Point','Update this point to your current position?',()=>{
    post('movePoint',{id:id}).then(()=>{
      post('getCoords').then(c=>{
        if(state.selectedPoint){
          state.selectedPoint.coords={x:c.x,y:c.y,z:c.z};
          state.selectedPoint.heading=c.heading;
          renderPointDetail();
        }
      });
    });
  },'Move Here');
}

function deletePoint(id){
  showModal('Delete Point','This cannot be undone. Are you sure?',()=>{
    post('deletePoint',{id:id}).then(()=>{
      state.selectedPoint=null;
      renderPointsList();
    });
  },'Delete');
}

function renderEditAction(){
  const p=state.selectedPoint;
  if(!p)return;
  setBreadcrumb([{label:'Home',action:'renderHome()'},{label:'Points',action:'renderPointsList()'},{label:p.label,action:'renderPointDetail()'},{label:'Action'}]);
  const a=p.action||{};
  content.innerHTML=`
    <div class="section-title">Action Configuration</div>
    <div class="form-group"><label>Trigger Kind</label>
      <select id="ea-kind">
        <option value="event" ${a.kind==='event'?'selected':''}>Client Event</option>
        <option value="server_event" ${a.kind==='server_event'?'selected':''}>Server Event</option>
        <option value="command" ${a.kind==='command'?'selected':''}>Command</option>
        <option value="export" ${a.kind==='export'?'selected':''}>Export</option>
        <option value="none" ${!a.kind?'selected':''}>None</option>
      </select>
    </div>
    <div class="form-group"><label>Event / Command / Export Name</label><input id="ea-name" value="${a.name||''}" placeholder="e.g. qb-garages:client:OpenMenu"></div>
    <div class="form-group"><label>Export Resource (export only)</label><input id="ea-resource" value="${a.resource||''}"></div>
    <div class="form-group"><label>Args (optional)</label><input id="ea-args" value="${a.args||''}"></div>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="renderPointDetail()">Cancel</button>
      <button class="btn btn-pink btn-block" onclick="submitAction()">Save Action</button>
    </div>`;
}

function submitAction(){
  const p=state.selectedPoint;if(!p)return;
  post('saveAction',{
    id:p.id,
    kind:document.getElementById('ea-kind').value,
    name:document.getElementById('ea-name').value,
    resource:document.getElementById('ea-resource').value,
    args:document.getElementById('ea-args').value
  }).then(()=>{
    const kind=document.getElementById('ea-kind').value;
    if(kind==='none'){p.action=null;}
    else{p.action={kind:kind,name:document.getElementById('ea-name').value,resource:document.getElementById('ea-resource').value||undefined,args:document.getElementById('ea-args').value||undefined};}
    renderPointDetail();
  });
}

// ── Job Config Injection ──────────────────────────

function renderJobsList(){
  setBreadcrumb([{label:'Home',action:'renderHome()'},{label:'Job Configs'}]);
  const entries=Object.entries(state.jobConfigs);
  if(!entries.length){content.innerHTML='<div class="empty">No job configs defined</div>';return;}
  content.innerHTML='<div class="section-title">Select a Job</div>'+
    entries.map(([res,jc])=>`
      <div class="card" onclick="selectJobConfig('${res}')">
        <div class="card-title">${jc.label}</div>
        <div class="card-desc">Write coords into ${res}/${jc.file}</div>
      </div>`).join('');
}

function selectJobConfig(res){
  state.selectedJobRes=res;
  state.selectedJob=state.jobConfigs[res];
  post('getJobLocations',{resource:res}).then(data=>{
    state.jobLocations=data.locations||[];
    renderJobLocTypes();
  });
}

function renderJobLocTypes(){
  const jc=state.selectedJob;const res=state.selectedJobRes;
  if(!jc)return;
  setBreadcrumb([{label:'Home',action:'renderHome()'},{label:'Jobs',action:'renderJobsList()'},{label:jc.label}]);
  const keys=Object.keys(jc.locations).sort();
  content.innerHTML='<div class="section-title">Location Types</div>'+
    keys.map(k=>{
      const def=jc.locations[k];
      const existing=(state.jobLocations||[]).filter(e=>e.type===k);
      return `<div class="card" onclick="renderPatchDialog('${res}','${k}')">
        <div class="card-title">${def.label||k}</div>
        <div class="card-desc">${k} | ${existing.length} slot(s) | arity ${def.arity}${def.nested?' | nested':''}</div>
      </div>`;
    }).join('');
}

function renderPatchDialog(res,locType){
  const jc=state.jobConfigs[res];
  const def=jc.locations[locType];
  const existing=(state.jobLocations||[]).filter(e=>e.type===locType);
  setBreadcrumb([{label:'Home',action:'renderHome()'},{label:'Jobs',action:'renderJobsList()'},{label:jc.label,action:'renderJobLocTypes()'},{label:def.label||locType}]);
  let maxIdx=0;
  let slotOpts=existing.map(e=>{if(e.index>maxIdx)maxIdx=e.index;return `<option value="${e.index}">#${e.index}  (${e.coords})</option>`;}).join('');
  if(!def.nested) slotOpts+=`<option value="new">+ new (#${maxIdx+1})</option>`;
  if(!slotOpts) slotOpts=`<option value="1">#1</option>`;
  content.innerHTML=`
    <div class="section-title">${def.label||locType}</div>
    <div class="form-group"><label>Slot</label><select id="pd-slot">${slotOpts}</select></div>
    <div class="form-group"><label>New Index (if "+ new")</label><input id="pd-newIdx" type="number" value="${maxIdx+1}" min="1"></div>
    <label class="checkbox-row" style="margin-bottom:12px"><input type="checkbox" id="pd-restart" ${jc.restart?'checked':''}> Restart ${res} after write</label>
    <div id="pd-coords" style="margin-bottom:12px;font-size:11px;color:var(--dim)">Position will be captured when you click Write.</div>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="renderJobLocTypes()">Cancel</button>
      <button class="btn btn-pink btn-block" onclick="submitPatch('${res}','${locType}')">Write Location</button>
    </div>`;
  post('getCoords').then(c=>{
    document.getElementById('pd-coords').innerHTML=
      'Your position: <span class="coords-badge">'+c.x.toFixed(2)+', '+c.y.toFixed(2)+', '+c.z.toFixed(2)+' | H: '+c.heading.toFixed(1)+'</span>';
  });
}

function submitPatch(res,locType){
  const slot=document.getElementById('pd-slot').value;
  const idx=slot==='new'?parseInt(document.getElementById('pd-newIdx').value):parseInt(slot);
  const restart=document.getElementById('pd-restart').checked;
  showModal('Confirm Write','Write '+res+'['+locType+']['+idx+'] at your feet? A backup is saved first.',()=>{
    post('patchLocation',{resource:res,locType:locType,index:idx,restart:restart}).then(()=>renderJobLocTypes());
  },'Write');
}

// ── Utility ───────────────────────────────────────

function toggleCoords(){post('toggleCoords');}
function exportPoints(){post('exportPoints');}

function closeUI(){
  app.classList.remove('open');
  post('close');
}

// ── Message Listener ──────────────────────────────

window.addEventListener('message',e=>{
  const d=e.data;
  if(d.type==='open'){
    if(d.data){
      state.points=d.data.points||[];
      state.types=d.data.types||{};
      state.jobs=d.data.jobs||[];
      state.jobConfigs=d.data.jobConfigs||{};
    }
    app.classList.add('open');
    if(d.page==='home') renderHome();
  }
  if(d.type==='close') app.classList.remove('open');
  if(d.type==='updatePoints'){
    state.points=d.points||[];
    if(state.selectedPoint){
      state.selectedPoint=state.points.find(p=>p.id===state.selectedPoint.id)||null;
    }
  }
});

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeUI();});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--pink:#FF1493;--pink-dim:rgba(255,20,147,.2);--bg:#0a0a12;--card:rgba(25,25,35,.95);--card-hover:rgba(35,35,50,.95);--text:#e0e0e0;--dim:#666;--danger:#e74c3c;--success:#2ecc71;--radius:10px}
body{font-family:-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;user-select:none;height:100vh;display:flex;flex-direction:column}
.app-header{padding:14px 16px 10px;text-align:center}
.app-title{font-size:13px;font-weight:700;letter-spacing:.5px;color:var(--pink)}
.app-subtitle{font-size:10px;color:var(--dim);margin-top:2px}
.tabs{display:flex;padding:0 16px;gap:4px;margin-bottom:2px}
.tab{flex:1;padding:8px 0;font-size:11px;font-weight:700;text-align:center;cursor:pointer;color:var(--dim);border-bottom:2px solid transparent;transition:all .2s;text-transform:uppercase;letter-spacing:.5px}
.tab.active{color:var(--pink);border-bottom-color:var(--pink)}
.content{flex:1;overflow-y:auto;padding:10px 14px 14px}
.content::-webkit-scrollbar{width:3px}.content::-webkit-scrollbar-thumb{background:var(--pink-dim);border-radius:2px}
.stat-row{display:flex;gap:8px;margin-bottom:10px}
.stat-box{flex:1;background:var(--card);border-radius:var(--radius);padding:10px 8px;text-align:center}
.stat-num{font-size:20px;font-weight:700;color:var(--pink)}
.stat-label{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin-top:1px}
.search{width:100%;padding:7px 10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:var(--radius);color:var(--text);font-size:11px;outline:none;margin-bottom:8px}
.search:focus{border-color:var(--pink)}
.member{background:var(--card);border-radius:var(--radius);padding:10px 12px;margin-bottom:6px}
.member-top{display:flex;align-items:center;justify-content:space-between}
.member-left{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dot.on{background:var(--success);box-shadow:0 0 5px rgba(46,204,113,.4)}
.dot.off{background:#444}
.member-name{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.member-rank{font-size:10px;color:var(--pink);background:var(--pink-dim);padding:1px 6px;border-radius:4px;white-space:nowrap}
.member-btns{display:flex;gap:3px;margin-top:6px}
.member-btns button{flex:1;padding:5px 0;border:none;border-radius:5px;cursor:pointer;font-size:10px;font-weight:700;transition:all .2s}
.btn-rank{background:rgba(46,204,113,.12);color:var(--success);border:1px solid rgba(46,204,113,.25)!important}
.btn-remove{background:rgba(231,76,60,.12);color:var(--danger);border:1px solid rgba(231,76,60,.25)!important}
.form-group{margin-bottom:10px}
.form-group label{display:block;font-size:10px;color:var(--dim);margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px}
.form-group input,.form-group select{width:100%;padding:7px 10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:var(--radius);color:var(--text);font-size:12px;outline:none}
.form-group input:focus,.form-group select:focus{border-color:var(--pink)}
.form-group select option{background:#1a1a2e}
.btn{width:100%;padding:9px;border:none;border-radius:var(--radius);cursor:pointer;font-size:11px;font-weight:700;transition:all .15s}
.btn-pink{background:var(--pink);color:#fff}
.btn-pink:hover{filter:brightness(1.15)}
.btn-outline{background:none;border:1px solid rgba(255,255,255,.12);color:var(--text)}
.btn-outline:hover{border-color:var(--pink)}
.section{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--pink);margin:12px 0 6px;font-weight:700}
.section:first-child{margin-top:0}
.nearby{background:var(--card);border-radius:var(--radius);padding:8px 12px;margin-bottom:5px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:all .15s}
.nearby:hover{border-color:var(--pink-dim);background:var(--card-hover)}
.nearby-name{font-size:12px;font-weight:600}
.nearby-meta{font-size:10px;color:var(--dim)}
.empty{text-align:center;padding:30px 0;color:var(--dim);font-size:12px}
.rank-panel{background:var(--card);border:1px solid var(--pink-dim);border-radius:var(--radius);padding:10px 12px;margin-top:6px}
.rank-panel select{margin-bottom:8px}
.rank-btns{display:flex;gap:6px}
.rank-btns button{flex:1;padding:7px;border:none;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer}
#modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:100}
#modal.hidden{display:none}
.modal-box{background:var(--bg);border:1px solid var(--pink-dim);border-radius:14px;padding:20px;width:85%;text-align:center}
.modal-box h3{font-size:13px;margin-bottom:8px}
.modal-box p{font-size:11px;color:var(--dim);margin-bottom:14px}
.modal-btns{display:flex;gap:8px}
.modal-btns button{flex:1;padding:8px;border:none;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer}
.modal-cancel{background:rgba(255,255,255,.08);color:var(--text)}
.modal-confirm{background:var(--danger);color:#fff}
.loading{text-align:center;padding:40px 0;color:var(--dim);font-size:12px}
.no-access{text-align:center;padding:50px 16px;color:var(--dim)}
.no-access .icon{font-size:32px;margin-bottom:10px;opacity:.3}
.no-access p{font-size:12px;line-height:1.5}
</style>
</head>
<body>
<div class="app-header">
  <div class="app-title">MANAGEMENT</div>
  <div class="app-subtitle" id="subtitle">Loading...</div>
</div>
<div class="tabs" id="tabs" style="display:none">
  <div class="tab active" data-tab="roster" onclick="switchTab('roster')">Roster</div>
  <div class="tab" data-tab="hire" onclick="switchTab('hire')">Hire</div>
</div>
<div class="content" id="content">
  <div class="loading">Loading...</div>
</div>
<div id="modal" class="hidden">
  <div class="modal-box">
    <h3 id="m-title"></h3>
    <p id="m-body"></p>
    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeModal()">Cancel</button>
      <button class="modal-confirm" id="m-ok">Confirm</button>
    </div>
  </div>
</div>

<script>
const content = document.getElementById('content');
const subtitle = document.getElementById('subtitle');
const tabsEl = document.getElementById('tabs');
const modal = document.getElementById('modal');

let S = {
  type: null, name: '', label: '', myGrade: 0,
  gangInfo: null, jobInfo: null,
  roster: [], grades: [], nearby: [],
  search: '', tab: 'roster'
};
let modalCb = null;

function post(ep, data) {
  return fetch(`https://som-gangboss-app/${ep}`, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(data || {})
  }).then(r => r.json()).catch(() => ({}));
}

function showModal(title, body, onOk) {
  document.getElementById('m-title').textContent = title;
  document.getElementById('m-body').textContent = body;
  modalCb = onOk;
  document.getElementById('m-ok').onclick = () => { const cb = modalCb; closeModal(); if (cb) cb(); };
  modal.classList.remove('hidden');
}
function closeModal() { modalCb = null; modal.classList.add('hidden'); }

function switchTab(tab) {
  S.tab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  if (tab === 'roster') loadRoster();
  else renderHire();
}

async function init() {
  const status = await post('getStatus');
  S.gangInfo = status.gang;
  S.jobInfo = status.job;

  if (!S.gangInfo && !S.jobInfo) {
    tabsEl.style.display = 'none';
    subtitle.textContent = '';
    content.innerHTML = `<div class="no-access"><div class="icon">&#128274;</div><p>You are not in a gang and you are not a business owner.<br><br>Join a gang or get promoted to boss to use this app.</p></div>`;
    return;
  }

  if (S.gangInfo) {
    S.type = 'gang';
    S.name = S.gangInfo.name;
    S.label = S.gangInfo.label;
    S.myGrade = S.gangInfo.grade;
  } else {
    S.type = 'job';
    S.name = S.jobInfo.name;
    S.label = S.jobInfo.label;
    S.myGrade = S.jobInfo.grade;
  }

  subtitle.textContent = S.label;
  tabsEl.style.display = 'flex';

  if (S.gangInfo && S.jobInfo) {
    const gangTab = document.createElement('div');
    gangTab.className = 'tab';
    gangTab.dataset.tab = 'switch';
    gangTab.textContent = S.type === 'gang' ? 'Job' : 'Gang';
    gangTab.onclick = () => {
      if (S.type === 'gang') {
        S.type = 'job'; S.name = S.jobInfo.name; S.label = S.jobInfo.label; S.myGrade = S.jobInfo.grade;
        gangTab.textContent = 'Gang';
      } else {
        S.type = 'gang'; S.name = S.gangInfo.name; S.label = S.gangInfo.label; S.myGrade = S.gangInfo.grade;
        gangTab.textContent = 'Job';
      }
      subtitle.textContent = S.label;
      switchTab(S.tab);
    };
    tabsEl.appendChild(gangTab);
  }

  loadRoster();
}

async function loadRoster() {
  content.innerHTML = '<div class="loading">Loading roster...</div>';
  const data = await post('getRoster', { type: S.type, name: S.name });
  if (data.error) { content.innerHTML = '<div class="empty">Failed to load roster</div>'; return; }
  S.roster = data.roster || [];
  S.grades = data.grades || [];
  if (data.label) { S.label = data.label; subtitle.textContent = S.label; }
  renderRoster();
}

function renderRoster() {
  let members = S.roster;
  if (S.search) {
    const q = S.search.toLowerCase();
    members = members.filter(m => m.name.toLowerCase().includes(q) || m.gradeName.toLowerCase().includes(q));
  }
  const online = S.roster.filter(m => m.online).length;

  let h = `<div class="stat-row"><div class="stat-box"><div class="stat-num">${S.roster.length}</div><div class="stat-label">Members</div></div><div class="stat-box"><div class="stat-num">${online}</div><div class="stat-label">Online</div></div></div>`;
  h += `<input class="search" placeholder="Search..." value="${S.search}" oninput="S.search=this.value;renderRoster()">`;

  if (!members.length) {
    h += '<div class="empty">No members found</div>';
  } else {
    members.forEach(m => {
      const canManage = S.myGrade > m.grade;
      h += `<div class="member"><div class="member-top"><div class="member-left"><div class="dot ${m.online?'on':'off'}"></div><div class="member-name">${esc(m.name)}</div></div><div class="member-rank">${esc(m.gradeName)}</div></div>`;
      if (canManage) {
        h += `<div class="member-btns"><button class="btn-rank" onclick="rankMenu('${m.citizenid}','${esc(m.name)}',${m.grade})">Rank</button><button class="btn-remove" onclick="fireMember('${m.citizenid}','${esc(m.name)}')">Remove</button></div>`;
      }
      h += '</div>';
    });
  }
  content.innerHTML = h;
}

function esc(s) { return s.replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/</g, '&lt;'); }

function rankMenu(cid, name, curGrade) {
  const avail = S.grades.filter(g => g.level !== curGrade && g.level < S.myGrade);
  if (!avail.length) return;
  const opts = avail.map(g => `<option value="${g.level}">${g.name} (${g.level})</option>`).join('');
  const panel = document.createElement('div');
  panel.className = 'rank-panel';
  panel.innerHTML = `<div style="font-size:11px;font-weight:600;margin-bottom:6px">Set rank for ${name}</div><div class="form-group"><select id="rk-sel">${opts}</select></div><div class="rank-btns"><button class="modal-cancel" onclick="renderRoster()">Cancel</button><button class="btn-pink" onclick="doSetGrade('${cid}')">Apply</button></div>`;
  content.appendChild(panel);
  panel.scrollIntoView({behavior:'smooth'});
}

async function doSetGrade(cid) {
  const grade = document.getElementById('rk-sel').value;
  await post('setGrade', { type: S.type, name: S.name, citizenid: cid, grade: parseInt(grade) });
  loadRoster();
}

function fireMember(cid, name) {
  showModal('Remove Member', `Remove ${name} from ${S.label}?`, async () => {
    await post('fire', { type: S.type, name: S.name, citizenid: cid });
    loadRoster();
  });
}

function renderHire() {
  const hiringGrades = S.grades.filter(g => g.level < S.myGrade);
  let opts = hiringGrades.map(g => `<option value="${g.level}">${g.name} (${g.level})</option>`).join('');

  let h = `<div class="section">Hire by Server ID</div>
    <div class="form-group"><label>Player ID</label><input id="h-id" type="number" placeholder="e.g. 5"></div>
    <div class="form-group"><label>Starting Rank</label><select id="h-grade">${opts}</select></div>
    <button class="btn btn-pink" onclick="doHire()" style="margin-bottom:14px">Hire Player</button>
    <div class="section">Nearby Players</div>
    <button class="btn btn-outline" onclick="scanNearby()" style="margin-bottom:8px">Scan Nearby</button>
    <div id="nearby-list"><div class="empty">Tap Scan to find players</div></div>`;

  content.innerHTML = h;
}

async function doHire() {
  const id = document.getElementById('h-id').value;
  const grade = document.getElementById('h-grade').value;
  if (!id) return;
  await post('hire', { type: S.type, name: S.name, targetSrc: parseInt(id), grade: parseInt(grade) });
}

async function scanNearby() {
  const list = document.getElementById('nearby-list');
  list.innerHTML = '<div class="empty">Scanning...</div>';
  const data = await post('getNearby');
  S.nearby = data.nearby || [];
  if (!S.nearby.length) {
    list.innerHTML = '<div class="empty">No players nearby</div>';
    return;
  }
  list.innerHTML = S.nearby.map(n => `<div class="nearby" onclick="document.getElementById('h-id').value=${n.src}"><div><div class="nearby-name">${esc(n.name)}</div><div class="nearby-meta">ID: ${n.src} &bull; ${n.dist}m</div></div></div>`).join('');
}

init();
</script>
</body>
</html>

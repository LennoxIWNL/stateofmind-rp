## State of Mind RP - som.cfg
##
## TRACKED IN GIT. This is everything that is not a secret: boot order,
## convars and permissions. server.cfg keeps the licence key, the database
## string and the host settings, and does nothing else.
##
## Why the split: server.cfg is gitignored, so for weeks every change to it was
## local only and had to be hand copied to the VPS. Config drifted silently
## between machines and produced bugs that looked like code bugs. Now a push
## carries the config too, and the only file you ever copy by hand is the one
## with your keys in it.
##
## Loaded by `exec som.cfg` at the bottom of server.cfg.

# Voice config
setr voice_useNativeAudio true
setr voice_useSendingRangeOnly true
setr voice_defaultCycle "GRAVE"
setr voice_defaultVolume 0.3
setr voice_enableRadioAnim 1
setr voice_syncData 1
setr voice_enableUi 1

setr UseTarget true

# ox_inventory config (convar based, not a config.lua)
setr inventory:framework "som"
# Money is NOT an inventory item in SOM. som-core owns cash, bank, crypto and
# dirty outright. Leaving this empty stops ox registering a 'money' account
# item, which would otherwise hold the authoritative cash count and drift from
# som_character_money. Cash is still robbable, via som-theft.
setr inventory:accounts "[]"
setr inventory:slots 40
setr inventory:weight 120000
setr inventory:target false
# No ox_inventory notifications. SOM has its own notification style in som-ui,
# and two competing toast designs on screen is the inconsistency we are trying
# to remove. itemnotify kills the item pickup and drop cards, weaponnotify the
# equip and holster ones. Error toasts are redirected to som-ui by the som
# bridge rather than silenced, so failures still say why.
setr inventory:itemnotify 0
setr inventory:weaponnotify 0
setr inventory:disablesetupnotification 1
setr inventory:police '["police"]'
setr inventory:imagepath "nui://ox_inventory/web/images"

# ---------------------------------------------------------------------------
# Which cfg is this?
#
# som-core prints this value at boot. If it reports MISSING, the file being
# executed is not this file, and editing this one will never change anything.
# That is the first thing to check when permissions do not apply.
# ---------------------------------------------------------------------------
sets som_cfg_marker "som-cfg-exec-ok"

## Permissions ##
##
## MOVED ABOVE THE ENSURE LINES DELIBERATELY.
##
## At the bottom of the file these never took effect: `add_ace resource.som-core
## command allow` was declared and som-core's own ExecuteCommand calls were
## still denied, while `sets som_cfg_marker` higher up in the same file applied
## fine. Position was the only difference between them, so the block runs
## before anything is started.
##
## If ACE still does not resolve after this, som-core falls back to matching
## owner identifiers directly and staff access is unaffected. See
## som-core/shared/config.lua.

#
# SOM uses som.* ACEs, checked with IsPlayerAceAllowed in som-core. They drive
# entitlements as well as command access: som.god is the management tier and is
# the ONLY route to 10 character slots, since paid tiers stop at 7 by design.
# See som-core/shared/tiers.lua and patreon.md.
#
# ORDER MATTERS HERE. Principals are declared before the ACEs that reference
# them, and the direct grants at the bottom exist because a single bad
# identifier in this block previously stopped the rest of it taking effect:
# `command` resolved but every som.* ACE denied.

# --- Groups -----------------------------------------------------------------
add_principal group.god group.admin
add_principal group.admin group.mod

# --- Owner (Lennox) ---------------------------------------------------------
# The license identifier is the reliable one: it works without Steam and is
# what the server sees regardless of which platform the player launched from.
add_principal identifier.license:1edd18060d34914e203e0036ff7ea5ae0a06ae7e group.god

# --- Group ACEs -------------------------------------------------------------
add_ace group.god som.god allow
add_ace group.god som.admin allow
add_ace group.god som.mod allow
add_ace group.god command allow

add_ace group.admin som.admin allow
add_ace group.admin som.mod allow
add_ace group.admin command allow

add_ace group.mod som.mod allow

# --- Direct grants ----------------------------------------------------------
# Belt and braces. Granted straight to the identifier rather than through a
# group, so management access survives a mistake anywhere in the block above.
add_ace identifier.license:1edd18060d34914e203e0036ff7ea5ae0a06ae7e som.god allow
add_ace identifier.license:1edd18060d34914e203e0036ff7ea5ae0a06ae7e som.admin allow
add_ace identifier.license:1edd18060d34914e203e0036ff7ea5ae0a06ae7e som.mod allow
add_ace identifier.license:1edd18060d34914e203e0036ff7ea5ae0a06ae7e command allow

# --- Resources --------------------------------------------------------------
add_ace resource.som-core command allow
add_ace resource.som-economy command allow

# ---------------------------------------------------------------------------
# Boot order
# ---------------------------------------------------------------------------

# Cfx stock managers
ensure mapmanager
# The stock cfx `chat` is absent from this server (only chat-theme-gtao, which
# is just a theme for it), so no typed command was reachable. som-chat replaces
# it further down and declares `provide 'chat'`.
ensure spawnmanager
ensure sessionmanager
ensure basic-gamemode
ensure hardcap
ensure baseevents

# connectqueue is NOT started in dev mode.
#
# Its Config.JoinDelay is 120000ms, so it holds every connection for two
# minutes after a restart while other resources settle. That used to be hidden
# by the long boot caused by [assets-streams]; now that dev mode boots in
# seconds, it is simply two minutes of waiting per restart.
#
# Re-enable it for the full boot. To keep it while iterating, lower JoinDelay
# in connectqueue/server/sv_queue_config.lua instead.
#
# Note it sets Config.DisableHardCap = true, so with it off, hardcap enforces
# sv_maxclients normally.
#
# ensure connectqueue

# Anti-cheat first so it monitors from the first connect
ensure [anticheats]

# Libraries
ensure ox_lib
ensure oxmysql
ensure PolyZone
ensure screenshot-basic

# SOM framework. som-core must start before anything that reads player state.
ensure som-assets
ensure som-core
ensure som-ui
ensure som-chat
# ox_target replaces qb-target, which was escrow protected and unversioned so
# it could never be read, patched or upgraded. An AIMING eye: hold Left Alt,
# look at something, options appear beside it, left click picks one.
#
# Configured by convar rather than by patching a file, so an upgrade of the
# resource cannot quietly undo it.
setr ox_target:defaultHotkey "LMENU"
setr ox_target:toggleHotkey 0
setr ox_target:leftClick 1
setr ox_target:debug 0
ensure ox_target
ensure som-interact
ensure ox_inventory
# som-multichar is what lets a player enter the world at all. Without it
# nobody gets past the loading screen.
ensure som-multichar
ensure som-appearance
ensure som-theft
ensure som-economy
ensure som-phone
ensure som-pause
ensure som-id
ensure som-radial
ensure som-rentals

# Interior shells for the character select scene. Started by name because dev
# mode does not ensure [assets-streams], and without it the shell model does
# not exist and som-multichar falls back to the plain world scene.
ensure jordqn_free_shells

# Coloured map, replacing minimap_main_map.gfx and the minimap tiles, which is
# both the minimap and the native pause menu map. 19MB, named explicitly
# because dev mode skips the rest of [assets-streams].
ensure karma-minimap

# som-compat answers exports['qb-core']:GetCoreObject() for preserved
# third-party resources (ps-mdt). It declares provide 'qb-core', so it must
# never run alongside qbx_core. qbx_core is removed, so this is safe.
ensure som-compat

# Voice
ensure [voice]

# ===========================================================================
# DEV MODE (currently active)
#
# Framework only. Boots in seconds because it skips the ~5GB of streamed
# assets and every leftover QBCore-dependent resource.
#
# Folder-wide ensures are deliberately NOT used. `ensure [custom]` and
# `ensure [standalone]` would start elixir-base, elixir-hud, elixir-petshop,
# r14-evidence, som-spray, ox_doorlock and Lennox-DoorCreator, all of which
# still call QBCore members som-compat does not implement. They are kept on
# disk only for the streamed props inside them.
#
# To go back to a full boot, comment this block out and uncomment FULL BOOT.
# ===========================================================================

ensure ps-mdt

# ===========================================================================
# FULL BOOT (inactive)
#
# Uncomment once the leftover resources have had their stream/ folders
# salvaged into [assets-streams] and their QBCore-dependent Lua removed.
# ===========================================================================
#
# ensure [standalone]
# ensure [custom]
# ensure [som]
#
# Heavy streaming assets load LAST so the framework is up and the server is
# responsive (heartbeat OK) before the ~5GB of ped/vehicle streams mount.
# ensure [assets-streams]
#
# [qb], [new] and [jobs] hold a handful of resources kept only for their
# streamed props. Their Lua is QBCore-dependent and throws on every start.
# ensure [qb]
# ensure [new]
# ensure [jobs]

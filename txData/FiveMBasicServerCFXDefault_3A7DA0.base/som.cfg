# connectqueue is NOT started in dev mode.
#
# Its Config.JoinDelay is 120000ms, so it holds every connection for two
# minutes after a restart while other resources settle. That used to be hidden
# by the long boot caused by [assets-streams], now that dev mode boots in
# seconds, it is simply two minutes of waiting per restart.
#
# Re-enable it for the full boot. To keep it while iterating, lower JoinDelay
# in connectqueue/server/sv_queue_config.lua instead.
#
# Note it sets Config.DisableHardCap = true, so with it off, hardcap enforces
# sv_maxclients normally.
#
# ensure connectqueue

# Anti-cheat first so it monitors from the first connect
ensure [anticheats]

# Libraries
ensure ox_lib
ensure oxmysql
ensure PolyZone
ensure screenshot-basic

# The loading screen. FIRST, and deliberately so: a loadscreen has to be
# mounted before the game starts loading or there is nothing to show. It has no
# dependencies for exactly that reason, including no link to som-assets, since
# nothing else is guaranteed to be up yet.
ensure som-loading

# SOM framework. som-core must start before anything that reads player state.
ensure som-assets
ensure som-core
ensure som-ui
ensure som-chat
# The permanent HUD: condition rings, voice, and the vehicle panel. Read only,
# with no server half and no NUI callback. It reads som-medical's downed state
# to stand itself down, but guards that with a resource state check, so it does
# not have to start after it.
# som-hud is RETIRED in favour of ps-hud, at the owner's call.
#
# Four rounds of play-testing kept finding basic faults in it, and a maintained
# HUD that thousands of servers run is a better use of the owner's time than
# iterating on ours. The resource is left on disk rather than deleted: its
# seatbelt ejection physics and its /sethud layout editor have no ps-hud
# equivalent, so they may be worth lifting back out later.
#
# TWO HUDS MUST NOT BOTH RUN. Both drive DisplayRadar, and ps-hud calls
# DisplayRadar(false) once a second whenever it thinks the player is not logged
# in, so leaving som-hud ensured would produce a minimap that flickers.
#
# ensure som-hud


# ox_target replaces qb-target, which was escrow protected and unversioned so
# it could never be read, patched or upgraded. An AIMING eye: hold Left Alt,
# look at something, options appear beside it, left click picks one.
#
# Configured by convar rather than by patching a file, so an upgrade of the
# resource cannot quietly undo it.
setr ox_target:defaultHotkey "LMENU"
setr ox_target:toggleHotkey 0
setr ox_target:leftClick 1
setr ox_target:debug 0
# How far the eye reaches, in metres. Stock ox_target hardcodes 20, which lights
# up interactions from across a car park. Lower this to make the eye tighter.
setr ox_target:maxDistance 5
ensure ox_target
ensure som-interact


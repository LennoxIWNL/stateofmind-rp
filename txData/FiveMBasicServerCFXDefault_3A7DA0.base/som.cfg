#
# origen_police supplies the patrol fleet, TIG-PACK the two pursuit cars.
# Together ~120MB, which every client downloads on first connect.
# TIG-PACK is NOT started: none of its models spawn. Left on disk in case the
# pack is fixed or replaced.
ensure origen_police
# LSPD vehicle models, from Zerofour04's Emergency Car Pack. Non-ELS.
#
# These REPLACE vanilla police models rather than adding spawn names, so
# som-police's fleet config works whether or not they are streaming, and
# removing them degrades the look rather than breaking the motor pool.
#
# Sheriff-Cars and Sheriff-High-Speed-Unit from the same pack were deliberately
# not installed: Mission Row is a city station.
#
# The models are gitignored like every other streamed asset, so these have to
# be copied to the server by hand. See AUDIT on why streamed binaries stay out
# of git.
ensure lspd-Police-Cars

# Civilian traffic. Twenty lore-friendly cars from the LNWK-CARS bundle,
# ~274MB, chosen for being sedate: sedans, wagons, pickups, two SUVs and a van.
# The pack ships 156 and most are drift builds and supercars, which is a car
# meet rather than a street.
#
# som-lorefriendly only makes the models exist. som-traffic is what puts them
# into ambient traffic, and is separate because everything under
# [assets-streams] is gitignored and hand-copied, so the decision would never
# be committed if it lived there. Start som-lorefriendly alone to test a spawn
# without touching traffic.
#
# The models are gitignored like every other streamed asset and have to be
# copied to the server by hand.
ensure som-lorefriendly

# som-traffic is OFF until it can be rebuilt from a real vanilla popgroups.ymt.
#
# DLC_POP_GROUPS REPLACES the population list rather than merging into it, so
# whatever this ships becomes the complete set of groups the game has. That
# makes the source it is built from load bearing, and ours was bad.
#
# It was rebuilt from karma_visuals' popgroups.ymt, which turns out to be an
# INCOMPLETE dump: it defines no Downtown_Tramps, Downtown_BevHills,
# Downtown_Hipsters, Downtown_StreetGeneral or Downtown_Vinewood, yet its own
# popcycle.dat names them. A pack whose two halves disagree with each other is
# not a vanilla reference, and neither binary popgroups in this tree is either
# (qb-smallresources' predates Cayo Perico).
#
# So the current file is missing five ped groups that Downtown's schedules ask
# for by name, and there is nothing on disk to repair it from. The correct
# source is a popgroups.ymt extracted from an actual GTA V install.
#
# A world with pedestrians matters more than which sedans are in it. Turning
# this off restores stock traffic composition, som-lorefriendly stays ensured so
# the twenty cars still exist for the garage and the dealership to use.
#
# ensure som-traffic
ensure lspd-Police-Bike
ensure lspd-Police-SWAT

# som-compat answers exports['qb-core']:GetCoreObject() for preserved
# third-party resources (ps-mdt). It declares provide 'qb-core', so it must
# never run alongside qbx_core. qbx_core is removed, so this is safe.
ensure som-compat

# ps-hud, with som-compat bridging it to SOM. What that bridge covers:
#   * shared/locale.lua, because ps-hud's manifest @-references a qb-core FILE
#     and there is no qb-core directory here
#   * the isLoggedIn statebag, which gates ps-hud's whole render loop and which
#     nothing in SOM previously set
#   * QBCore:Client:OnPlayerLoaded and QBCore:Player:SetPlayerData. ps-hud keeps
#     its own copy of player data and refreshes it ONLY from those two events,
#     and its render loop indexes that copy every tick, so without them the loop
#     died on its first pass rather than merely staying hidden
#   * QBCore.Functions.HasPermission, mapped onto som.* ACEs
#   * hunger, thirst and stress, translated from som-core metadata into the
#     events ps-hud listens for
#   * GetFuel, because ps-hud calls the fuel resource from inside that same
#     render loop and no fuel resource is installed
#
# AFTER som-compat, which supplies all of the above.
#
# ALSO AFTER karma-minimap, and that is load-bearing rather than incidental.
# Both resources stream a file called minimap.gfx: karma-minimap's is at
# stream/gfx/minimap.gfx and ps-hud's at stream/minimap.gfx. Two resources
# streaming one asset name is resolved by load order, so this ensure must stay
# below karma-minimap's or the frame ps-hud draws stops matching the HUD around
# it. karma-minimap keeps what it is actually for either way: the coloured map
# tiles and minimap_main_map.gfx, whose names do not collide.
#
# Ordering makes the outcome CONSISTENT, not correct by construction. The only
# way to remove the ambiguity is to delete one of the two files, which is a
# binary asset and so the owner's call. See som-compat/MINIMAP.md.
ensure ps-hud


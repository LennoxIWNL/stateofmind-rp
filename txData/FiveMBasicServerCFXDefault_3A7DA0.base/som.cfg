## State of Mind RP - som.cfg
##
## TRACKED IN GIT. This is everything that is not a secret: boot order,
## convars and permissions. server.cfg keeps the licence key, the database
## string and the host settings, and does nothing else.
##
## Why the split: server.cfg is gitignored, so for weeks every change to it was
## local only and had to be hand copied to the VPS. Config drifted silently
## between machines and produced bugs that looked like code bugs. Now a push
## carries the config too, and the only file you ever copy by hand is the one
## with your keys in it.
##
## Loaded by `exec som.cfg` at the bottom of server.cfg.

# Voice config
setr voice_useNativeAudio true
setr voice_useSendingRangeOnly true
setr voice_defaultCycle "GRAVE"
setr voice_defaultVolume 0.3
setr voice_enableRadioAnim 1
setr voice_syncData 1
# pma-voice draws its own "Normal [Range]" readout bottom right. som-hud shows
# the same thing as an icon in the condition row, and two readouts for one fact
# in two different styles is exactly the inconsistency being removed.
setr voice_enableUi 0

setr UseTarget true

# ox_inventory config (convar based, not a config.lua)
setr inventory:framework "som"
# Money is NOT an inventory item in SOM. som-core owns cash, bank, crypto and
# dirty outright. Leaving this empty stops ox registering a 'money' account
# item, which would otherwise hold the authoritative cash count and drift from
# som_character_money. Cash is still robbable, via som-theft.
setr inventory:accounts "[]"
setr inventory:slots 40
setr inventory:weight 120000
setr inventory:target false
# No ox_inventory notifications. SOM has its own notification style in som-ui,
# and two competing toast designs on screen is the inconsistency we are trying
# to remove. itemnotify kills the item pickup and drop cards, weaponnotify the
# equip and holster ones. Error toasts are redirected to som-ui by the som
# bridge rather than silenced, so failures still say why.
setr inventory:itemnotify 0
setr inventory:weaponnotify 0
setr inventory:disablesetupnotification 1
setr inventory:police '["police"]'
setr inventory:imagepath "nui://ox_inventory/web/images"

# Drops render their PROP on the ground rather than a bare marker. Off by
# default in ox_inventory, which is why a thrown item looked like it vanished:
# som-inventory passes the item's own prop model to CustomDrop, and without
# this nothing draws it.
setr inventory:dropprops 1

# ---------------------------------------------------------------------------
# Which cfg is this?
#
# som-core prints this value at boot. If it reports MISSING, the file being
# executed is not this file, and editing this one will never change anything.
# That is the first thing to check when permissions do not apply.
# ---------------------------------------------------------------------------
sets som_cfg_marker "som-cfg-exec-ok"

## Permissions ##
##
## MOVED ABOVE THE ENSURE LINES DELIBERATELY.
##
## At the bottom of the file these never took effect: `add_ace resource.som-core
## command allow` was declared and som-core's own ExecuteCommand calls were
## still denied, while `sets som_cfg_marker` higher up in the same file applied
## fine. Position was the only difference between them, so the block runs
## before anything is started.
##
## If ACE still does not resolve after this, som-core falls back to matching
## owner identifiers directly and staff access is unaffected. See
## som-core/shared/config.lua.

#
# SOM uses som.* ACEs, checked with IsPlayerAceAllowed in som-core. They drive
# entitlements as well as command access: som.god is the management tier and is
# the ONLY route to 10 character slots, since paid tiers stop at 7 by design.
# See som-core/shared/tiers.lua and patreon.md.
#
# ORDER MATTERS HERE. Principals are declared before the ACEs that reference
# them, and the direct grants at the bottom exist because a single bad
# identifier in this block previously stopped the rest of it taking effect:
# `command` resolved but every som.* ACE denied.

# --- Groups -----------------------------------------------------------------
add_principal group.god group.admin
add_principal group.admin group.mod

# --- Owner (Lennox) ---------------------------------------------------------
# The license identifier is the reliable one: it works without Steam and is
# what the server sees regardless of which platform the player launched from.
add_principal identifier.license:1edd18060d34914e203e0036ff7ea5ae0a06ae7e group.god

# --- Group ACEs -------------------------------------------------------------
add_ace group.god som.god allow
add_ace group.god som.admin allow
add_ace group.god som.mod allow
add_ace group.god command allow

add_ace group.admin som.admin allow
add_ace group.admin som.mod allow
add_ace group.admin command allow

add_ace group.mod som.mod allow

# --- Direct grants ----------------------------------------------------------
# Belt and braces. Granted straight to the identifier rather than through a
# group, so management access survives a mistake anywhere in the block above.
add_ace identifier.license:1edd18060d34914e203e0036ff7ea5ae0a06ae7e som.god allow
add_ace identifier.license:1edd18060d34914e203e0036ff7ea5ae0a06ae7e som.admin allow
add_ace identifier.license:1edd18060d34914e203e0036ff7ea5ae0a06ae7e som.mod allow
add_ace identifier.license:1edd18060d34914e203e0036ff7ea5ae0a06ae7e command allow

# --- Resources --------------------------------------------------------------
add_ace resource.som-core command allow
add_ace resource.som-economy command allow

# ---------------------------------------------------------------------------
# Boot order
# ---------------------------------------------------------------------------

# Cfx stock managers
ensure mapmanager
# The stock cfx `chat` is absent from this server (only chat-theme-gtao, which
# is just a theme for it), so no typed command was reachable. som-chat replaces
# it further down and declares `provide 'chat'`.
ensure spawnmanager
ensure sessionmanager
ensure basic-gamemode
ensure hardcap
ensure baseevents

# connectqueue is NOT started in dev mode.
#
# Its Config.JoinDelay is 120000ms, so it holds every connection for two
# minutes after a restart while other resources settle. That used to be hidden
# by the long boot caused by [assets-streams]; now that dev mode boots in
# seconds, it is simply two minutes of waiting per restart.
#
# Re-enable it for the full boot. To keep it while iterating, lower JoinDelay
# in connectqueue/server/sv_queue_config.lua instead.
#
# Note it sets Config.DisableHardCap = true, so with it off, hardcap enforces
# sv_maxclients normally.
#
# ensure connectqueue

# Anti-cheat first so it monitors from the first connect
ensure [anticheats]

# Libraries
ensure ox_lib
ensure oxmysql
ensure PolyZone
ensure screenshot-basic

# SOM framework. som-core must start before anything that reads player state.
ensure som-assets
ensure som-core
ensure som-ui
ensure som-chat
# The permanent HUD: condition rings, voice, and the vehicle panel. Read only,
# with no server half and no NUI callback. It reads som-medical's downed state
# to stand itself down, but guards that with a resource state check, so it does
# not have to start after it.
ensure som-hud
# ox_target replaces qb-target, which was escrow protected and unversioned so
# it could never be read, patched or upgraded. An AIMING eye: hold Left Alt,
# look at something, options appear beside it, left click picks one.
#
# Configured by convar rather than by patching a file, so an upgrade of the
# resource cannot quietly undo it.
setr ox_target:defaultHotkey "LMENU"
setr ox_target:toggleHotkey 0
setr ox_target:leftClick 1
setr ox_target:debug 0
# How far the eye reaches, in metres. Stock ox_target hardcodes 20, which lights
# up interactions from across a car park. Lower this to make the eye tighter.
setr ox_target:maxDistance 5
ensure ox_target
ensure som-interact
ensure ox_inventory
# som-multichar is what lets a player enter the world at all. Without it
# nobody gets past the loading screen.
ensure som-multichar
ensure som-appearance
ensure som-theft
ensure som-economy
ensure som-phone
ensure som-pause
ensure som-id
ensure som-radial
ensure som-rentals

# The half of the inventory that decides. Throwing and giving to a named nearby
# player have no stock ox_inventory path, so they are validated here. The page
# itself is served by ox_inventory, for the frame-ownership reason written into
# som-inventory's fxmanifest.
ensure som-inventory

# Placeable cones, barriers and worklights. Reads the `placeable` block on
# ox_inventory's items, so it starts after ox_inventory above.
ensure som-props

# The downed state. Down is down: no crawling, no last stand, no second death.
# With no medic online a downed player takes a timed hospital respawn for a fee.
# som-police reads its downed state for custody, so it starts before that.
ensure som-medical

# som-police reads som-economy (department account, fines, armoury prices) and
# som-interact (the eye), so it starts after both. It also calls som-phone to
# deliver fines as auto-collecting bills, but guards that with a resource state
# check rather than a hard dependency, so the order there does not matter.
ensure som-police

# Crime alerts and the call store. It declares `provide 'ps-dispatch'` and
# publishes GetDispatchCalls under that name, which is how ps-mdt's dispatch
# page, map and waypoints work without ps-dispatch existing. Never run it
# alongside a real ps-dispatch: both claim the name.
ensure som-dispatch

# Vehicle ownership and garages. It owns the som_vehicles lifecycle, so it is
# the only thing that creates a vehicle row. Starts AFTER som-police because it
# reads certifications from it, and because som-police stands its own motor pool
# down when this is running rather than stacking two on one door.
ensure som-garage

# Interior shells for the character select scene. Started by name because dev
# mode does not ensure [assets-streams], and without it the shell model does
# not exist and som-multichar falls back to the plain world scene.
ensure jordqn_free_shells

# Coloured map, replacing minimap_main_map.gfx and the minimap tiles, which is
# both the minimap and the native pause menu map. 19MB, named explicitly
# because dev mode skips the rest of [assets-streams].
ensure karma-minimap

# Gabz MRPD. Named explicitly for the same reason: dev mode skips
# [assets-streams], so without this the station is vanilla MRPD and every
# som-police coordinate lands in the wrong building.
#
# cfx-gabz-mapdata carries the shared Gabz timecycle and is tiny; mrpd itself
# is 72MB, so this does lengthen the boot.
#
# If props are missing inside the station, also add cfx-gabz-pdprops. It is
# listed separately because it declares a dependency on cfx-gabz-davispd, so
# the two only start as a pair, and neither is needed for the shell of MRPD.
ensure cfx-gabz-mapdata
ensure mrpd

# Police vehicle packs. Named explicitly for the same reason as MRPD: dev mode
# skips [assets-streams], so without these the addon models simply do not exist
# and every fleet spawn silently fails.
#
# ex-cars is NOT started. Its police models have broken liveries and misaligned
# headlights, and at 365MB it is a large download for cars nobody uses. Left on
# disk in case its civilian half is wanted later.
#
# origen_police supplies the patrol fleet, TIG-PACK the two pursuit cars.
# Together ~120MB, which every client downloads on first connect.
# TIG-PACK is NOT started: none of its models spawn. Left on disk in case the
# pack is fixed or replaced.
ensure origen_police
# LSPD vehicle models, from Zerofour04's Emergency Car Pack. Non-ELS.
#
# These REPLACE vanilla police models rather than adding spawn names, so
# som-police's fleet config works whether or not they are streaming, and
# removing them degrades the look rather than breaking the motor pool.
#
# Sheriff-Cars and Sheriff-High-Speed-Unit from the same pack were deliberately
# not installed: Mission Row is a city station.
#
# The models are gitignored like every other streamed asset, so these have to
# be copied to the server by hand. See AUDIT on why streamed binaries stay out
# of git.
ensure lspd-Police-Cars

# Civilian traffic. Twenty lore-friendly cars from the LNWK-CARS bundle,
# ~274MB, chosen for being sedate: sedans, wagons, pickups, two SUVs and a van.
# The pack ships 156 and most are drift builds and supercars, which is a car
# meet rather than a street.
#
# som-lorefriendly only makes the models exist. som-traffic is what puts them
# into ambient traffic, and is separate because everything under
# [assets-streams] is gitignored and hand-copied, so the decision would never
# be committed if it lived there. Start som-lorefriendly alone to test a spawn
# without touching traffic.
#
# The models are gitignored like every other streamed asset and have to be
# copied to the server by hand.
ensure som-lorefriendly
ensure som-traffic
ensure lspd-Police-Bike
ensure lspd-Police-SWAT

# som-compat answers exports['qb-core']:GetCoreObject() for preserved
# third-party resources (ps-mdt). It declares provide 'qb-core', so it must
# never run alongside qbx_core. qbx_core is removed, so this is safe.
ensure som-compat

# Voice
ensure [voice]

# ===========================================================================
# DEV MODE (currently active)
#
# Framework only. Boots in seconds because it skips the ~5GB of streamed
# assets and every leftover QBCore-dependent resource.
#
# Folder-wide ensures are deliberately NOT used. `ensure [custom]` and
# `ensure [standalone]` would start elixir-base, elixir-hud, elixir-petshop,
# r14-evidence, som-spray, ox_doorlock and Lennox-DoorCreator, all of which
# still call QBCore members som-compat does not implement. They are kept on
# disk only for the streamed props inside them.
#
# To go back to a full boot, comment this block out and uncomment FULL BOOT.
# ===========================================================================

ensure ps-mdt

# Door locks. Its table is already in setup.sql but seeds NO doors: the door
# list is built in game with /doorlock, not from a config file.
#
# It picks its framework bridge with GetResourceState, and `provide 'qb-core'`
# does not satisfy that, so it ships with a som-compat bridge patched in. Start
# it AFTER som-compat or the bridge will not be found.
ensure ox_doorlock

# ===========================================================================
# STREAMED ASSETS (active)
#
# The whole group, at the owner's request. Loads LAST so the framework is up
# and the server is answering its heartbeat before ~5GB of ped, map and vehicle
# streams mount. Expect a much longer boot than dev mode and a large first
# download for every connecting client.
#
# The named ensures earlier in this file (jordqn_free_shells, karma-minimap,
# cfx-gabz-mapdata, mrpd, origen_police) are now redundant, since all five live
# in here. They are kept because they start those five EARLY, before the rest of
# the group, and a second ensure of an already-started resource does nothing.
#
# Four things in this group were previously judged unfit and come back with it.
# None of them breaks a boot, but each is a live effect rather than dead weight:
#
#   ex-cars           dropped for broken liveries and misaligned headlights.
#                     365MB every client now downloads. No fleet references it.
#   TIG-PACK          its models do not spawn. Harmless, still downloaded.
#   rd-vehicleconfig  a 598 entry handling.meta and ~400 model declarations with
#   ro-VehicleConfig  no stream folder. The phantom models stay phantom, but the
#                     handling file OVERRIDES vanilla handling for real base game
#                     cars server wide. If handling feels wrong on ordinary
#                     traffic after this change, look here first.
#   karma_visuals     replaces vehicles.meta for 299 vanilla models and carries
#                     its own timecycle, weather, water and popcycle. A global
#                     visual change, not a per-vehicle one.
#
# CORRECTED. The group ensure above was the wrong tool: it is all or nothing,
# it started roughly 70 resources when we use a fraction of them, and it pulled
# in four packs already judged unfit. Every client downloaded all of it.
#
# Everything below starts because something depends on it. Everything in the
# "available, not started" list is on disk and one line away.
# ===========================================================================

# ALREADY STARTED EARLIER in this file, and deliberately so: they load before
# som-compat and the rest, which is the ordering those sections rely on.
#   cfx-gabz-mapdata, mrpd, karma-minimap, jordqn_free_shells, origen_police
# Listing them again here would be a harmless no-op but a confusing one.

# Station props, and the Davis PD they declare a dependency on. Only start as a
# pair.
ensure cfx-gabz-davispd
ensure cfx-gabz-pdprops

# Los Santos Customs. som-garage has an lscustoms garage at this interior.
ensure cfx-gabz-lscustoms

# Vehicle handling and config. DELIBERATE, at the owner's instruction.
#
# rd-vehicleconfig ships a 598 entry handling.meta that overrides vanilla
# handling for base game cars server wide. That is the intent, not a side
# effect: it is a handling overhaul. Noted here only so a future session does
# not "discover" it and helpfully turn it off again.
#
# Both also declare roughly 400 models with no stream folder. Those models
# simply do not exist, which is harmless: they are never spawned by anything.
ensure rd-vehicleconfig
ensure ro-VehicleConfig

# Weapon models and their metas. som-gunmetas carries the stats.
ensure som-custom_weapons
ensure som-custom_weapons_melee
ensure som-custom_weapons_thrown
ensure som-gunmetas

